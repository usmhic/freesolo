name: CI - Web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main, dev]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/freesolo-web

jobs:
  # ── Type-check and lint ───────────────────────────────────────────────────────
  checks:
    name: Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      SPRING_BOOT_API_URL: http://localhost:8080
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral CI secret
        shell: bash
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_secret"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run types:check

      - name: Lint
        run: pnpm run lint

  # ── Build and push Docker image ───────────────────────────────────────────────
  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-,format=short

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}

  # ── Docker smoke test (PRs only) ─────────────────────────────────────────────
  docker-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral CI secret
        shell: bash
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_secret"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          load: true
          tags: freesolo-web:pr-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_URL=http://localhost:3000

      - name: Start container
        run: |
          docker run -d --name freesolo-web-test -p 3000:3000 \
            -e SPRING_BOOT_API_URL=http://localhost:8080 \
            -e JWT_SECRET \
            -e NEXT_PUBLIC_APP_URL=http://localhost:3000 \
            freesolo-web:pr-test

      - name: Wait for server
        run: |
          for i in {1..24}; do
            if curl -fsS http://localhost:3000/ -o /dev/null 2>&1; then
              echo "✓ Web server ready"
              exit 0
            fi
            echo "[$i/24] Waiting for web server…"
            sleep 5
          done
          echo "✗ Web server failed to become healthy"
          docker logs freesolo-web-test || true
          exit 1

      - name: Verify response
        run: |
          HTTP_CODE=$(curl -w "%{http_code}" -s -o /dev/null http://localhost:3000/)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Web server response: $HTTP_CODE"
          else
            echo "✗ Unexpected HTTP status: $HTTP_CODE"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f freesolo-web-test 2>/dev/null || true

  # ── Notify Dokploy ───────────────────────────────────────────────────────────
  dokploy:
    name: Notify Dokploy
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'
    steps:
      - name: Trigger deployment
        shell: bash
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEB_WEBHOOK_URL }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_WEBHOOK_URL:-}" ]; then
            echo "⊘ DOKPLOY_WEB_WEBHOOK_URL not configured; skipping"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -d "$(printf '{"sha":"%s","ref":"%s","digest":"%s"}' \
                  "${GITHUB_SHA}" "${GITHUB_REF_NAME}" "${DIGEST}")" \
            "${DOKPLOY_WEBHOOK_URL}"
          echo "✓ Deployment triggered"
