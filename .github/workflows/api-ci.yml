name: CI - API

on:
  pull_request:
    paths:
      - "api/**"
      - ".env.example"
      - "docker-compose.yml"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main, dev]
    paths:
      - "api/**"
      - ".env.example"
      - "docker-compose.yml"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/freesolo-api
  JAVA_VERSION: "21"

jobs:
  # ── Build and test ────────────────────────────────────────────────────────────
  build:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: freesolo_test
          POSTGRES_USER: freesolo
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/freesolo_test?user=freesolo
      JWT_EXPIRATION_MS: 3600000
      ADMIN_EMAIL: admin@test.local
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      EMAIL_FROM: "FreeSolo <noreply@test.local>"
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_BUCKET: freesolo-test

    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral CI credentials
        shell: bash
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          minio_access="$(openssl rand -hex 16)"
          minio_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$minio_access"
          echo "::add-mask::$minio_secret"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "MINIO_ACCESS_KEY=$minio_access" >> "$GITHUB_ENV"
          echo "MINIO_SECRET_KEY=$minio_secret" >> "$GITHUB_ENV"

      - name: Validate Docker Compose
        working-directory: .
        run: docker compose config --no-interpolate --quiet

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and run tests
        run: mvn clean verify -B

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: api/target/surefire-reports/
          if-no-files-found: ignore

  # ── Build and push Docker image ───────────────────────────────────────────────
  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-,format=short

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Docker smoke test (PRs only) ─────────────────────────────────────────────
  docker-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: freesolo
          POSTGRES_USER: freesolo
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral CI credentials
        shell: bash
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          minio_access="$(openssl rand -hex 16)"
          minio_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$minio_access"
          echo "::add-mask::$minio_secret"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "MINIO_ACCESS_KEY=$minio_access" >> "$GITHUB_ENV"
          echo "MINIO_SECRET_KEY=$minio_secret" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          load: true
          tags: freesolo-api:pr-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name freesolo-api-test -p 8080:8080 \
            --network host \
            -e DATABASE_URL="jdbc:postgresql://localhost:5432/freesolo?user=freesolo" \
            -e JWT_SECRET \
            -e ADMIN_EMAIL=admin@test.local \
            -e CORS_ORIGINS=http://localhost:3000 \
            -e FRONTEND_URL=http://localhost:3000 \
            -e COOKIE_SECURE=false \
            -e MINIO_ENDPOINT=http://localhost:9000 \
            -e MINIO_ACCESS_KEY \
            -e MINIO_SECRET_KEY \
            freesolo-api:pr-test

      - name: Wait for Spring Boot
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "✓ API healthy"
              exit 0
            fi
            echo "[$i/30] Waiting for API…"
            sleep 5
          done
          echo "✗ API failed to become healthy"
          docker logs freesolo-api-test || true
          exit 1

      - name: Verify health endpoint
        run: |
          STATUS=$(curl -fsS http://localhost:8080/actuator/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          if [ "$STATUS" != "UP" ]; then
            echo "✗ Health status: $STATUS"
            exit 1
          fi
          echo "✓ Health status: $STATUS"

      - name: Cleanup
        if: always()
        run: docker rm -f freesolo-api-test 2>/dev/null || true

  # ── Notify Dokploy ───────────────────────────────────────────────────────────
  dokploy:
    name: Notify Dokploy
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'
    steps:
      - name: Trigger deployment
        shell: bash
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_API_WEBHOOK_URL }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_WEBHOOK_URL:-}" ]; then
            echo "⊘ DOKPLOY_API_WEBHOOK_URL not configured; skipping"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -d "$(printf '{"sha":"%s","ref":"%s","digest":"%s"}' \
                  "${GITHUB_SHA}" "${GITHUB_REF_NAME}" "${DIGEST}")" \
            "${DOKPLOY_WEBHOOK_URL}"
          echo "✓ Deployment triggered"
