name: freesolo

services:
  db:
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: freesolo
      POSTGRES_USER: freesolo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freesolo -d freesolo"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: freesolo
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Copy .env.example to .env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    environment:
      MINIO_ROOT_USER: freesolo
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Copy .env.example to .env}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing local/freesolo
        mc anonymous set download local/freesolo

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/freesolo
      SPRING_DATASOURCE_USERNAME: freesolo
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@freesolo.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:*,http://127.0.0.1:*,exp://*,freesolo://*}
      FRONTEND_URL: ${APP_URL:-http://localhost:3000}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${STORAGE_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: freesolo
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?Copy .env.example to .env}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 5

  web:
    build:
      context: ./web
      args:
        APP_URL: ${APP_URL:-http://localhost:3000}
        # Baked into the /api/** rewrite at build time. Points at the public
        # API host by default; the `environment:` value below only covers
        # server-side calls, not the browser-facing proxy.
        SPRING_BOOT_API_URL: ${API_URL:-https://api.freesolo.osas.cloud}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SPRING_BOOT_API_URL: http://api:8080
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5

volumes:
  postgres_data:
  minio_data:
