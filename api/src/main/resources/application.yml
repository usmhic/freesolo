spring:
  application:
    name: freesolo-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/freesolo}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Version 0 lets the V1 modular baseline run after Flyway adopts a legacy
    # non-empty database. The baseline moves public-schema tables without
    # recreating them, preserving existing rows and constraints.
    baseline-on-migrate: true
    baseline-version: "0"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:2592000000} # 30 days
  admin-email: ${ADMIN_EMAIL:admin@freesolo.local}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,exp://,freesolo://}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}

  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:FreeSolo <noreply@freesolo.app>}

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:freesolo}

  expo:
    access-token: ${EXPO_ACCESS_TOKEN:}
  app-store-url: ${APP_STORE_URL:https://apps.apple.com}
  play-store-url: ${PLAY_STORE_URL:https://play.google.com}

  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}
      client-secret: ${APPLE_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.freesolo: INFO
    org.springframework.security: WARN
